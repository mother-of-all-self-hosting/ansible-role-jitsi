---
- name: Verify Jitsi
  hosts: all
  become: true
  gather_facts: false

  vars:
    jitsi_verify_web_url: "http://127.0.0.1:{{ jitsi_molecule_web_port }}"
    jitsi_verify_prosody_http_url: "http://127.0.0.1:{{ jitsi_molecule_prosody_http_port }}"
    jitsi_verify_jicofo_url: "http://127.0.0.1:{{ jitsi_molecule_jicofo_rest_port }}"

    # The name carries both the role and the scenario, like the platform does,
    # so a leftover container can never be mistaken for another scenario's.
    jitsi_verify_control_container: "{{ inventory_hostname }}-negative-control"

    jitsi_verify_units:
      - jitsi-prosody.service
      - jitsi-jicofo.service
      - jitsi-jvb.service
      - jitsi-web.service

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: jitsi_defaults

    - name: Read the Jitsi containers the role created
      ansible.builtin.command:
        cmd: >-
          docker inspect
          {{ jitsi_molecule_web_container }}
          {{ jitsi_molecule_prosody_container }}
          {{ jitsi_molecule_jicofo_container }}
          {{ jitsi_molecule_jvb_container }}
      register: jitsi_containers_raw
      changed_when: false

    - name: Make sense of the Jitsi containers
      ansible.builtin.set_fact:
        jitsi_containers: >-
          {{
            dict(
              jitsi_containers_raw.stdout | from_json
              | map(attribute='Name') | map('regex_replace', '^/', '')
              | zip(jitsi_containers_raw.stdout | from_json)
            )
          }}

    # ------------------------------------------------------------------
    # The negative controls: the same images, without the role's doing
    # ------------------------------------------------------------------

    # Everything asserted below is only evidence about the role if the stock
    # images cannot produce it unaided. They cannot: since upstream stable-11146
    # the containers are rootless with a read-only root, and their s6 `10-config`
    # startup stage aborts the whole container without the configuration the
    # role provides (the web image for lack of a writable /storage and rendered
    # config, the jicofo image for lack of an auth password). A front page that
    # answers, or a jicofo that reports stats, is therefore the role's doing.
    - name: Run the Jitsi Web image with none of the role's configuration
      ansible.builtin.command:
        cmd: >-
          timeout 120
          docker run --rm --name {{ jitsi_verify_control_container }}
          --user=1000:1000 --read-only
          --tmpfs=/run:rw,exec,nosuid,size=16m,mode=1750
          --tmpfs=/tmp:rw,noexec,nosuid,size=16m,mode=1777
          {{ jitsi_containers[jitsi_molecule_web_container].Config.Image }}
      register: jitsi_web_control
      changed_when: true
      failed_when: false

    - name: Assert the Jitsi Web image cannot serve without the role's configuration
      ansible.builtin.assert:
        # 0 would mean it ran to completion, 124 that `timeout` had to stop a
        # container which was happily running. Either would make the web checks
        # below unattributable to the role.
        that: jitsi_web_control.rc not in [0, 124]
        fail_msg: >-
          The unconfigured Jitsi Web image exited with {{ jitsi_web_control.rc }},
          so a serving web frontend cannot be credited to the role
        success_msg: >-
          The unconfigured Jitsi Web image dies on startup (rc={{ jitsi_web_control.rc }}),
          so a web frontend that serves anything at all is the role's doing

    - name: Run the Jicofo image with none of the role's configuration
      ansible.builtin.command:
        cmd: >-
          timeout 120
          docker run --rm --name {{ jitsi_verify_control_container }}
          --user=1000:1000 --read-only
          --tmpfs=/run:rw,exec,nosuid,size=16m,mode=1750
          --tmpfs=/tmp:rw,noexec,nosuid,size=16m,mode=1777
          {{ jitsi_containers[jitsi_molecule_jicofo_container].Config.Image }}
      register: jitsi_jicofo_control
      changed_when: true
      failed_when: false

    - name: Assert the Jicofo image cannot start without the role's configuration
      ansible.builtin.assert:
        that: jitsi_jicofo_control.rc not in [0, 124]
        fail_msg: >-
          The unconfigured Jicofo image exited with {{ jitsi_jicofo_control.rc }},
          so nothing the REST API reports below can be credited to the role
        success_msg: >-
          The unconfigured Jicofo image dies on startup (rc={{ jitsi_jicofo_control.rc }}),
          so a Jicofo that reports stats is the role's doing

    # ------------------------------------------------------------------
    # The units are up
    # ------------------------------------------------------------------

    - name: Wait for the Jitsi systemd services to become active (up to 180s each)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: jitsi_services
      until: jitsi_services.status.ActiveState == 'active'
      retries: 36
      delay: 5
      loop: "{{ jitsi_verify_units }}"

    - name: Assert the Jitsi systemd services are active
      ansible.builtin.assert:
        that: jitsi_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
        fail_msg: >-
          Not every Jitsi service is active:
          {{ dict(jitsi_verify_units | zip(jitsi_services.results | map(attribute='status.ActiveState'))) }}
        success_msg: "All four Jitsi systemd services are active"

    - name: Retrieve the Jitsi service logs for debugging
      when: jitsi_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: "journalctl -xeu {{ item }}"
      changed_when: false
      loop: "{{ jitsi_verify_units }}"

    # ------------------------------------------------------------------
    # The control plane holds together: Jicofo sees a registered bridge
    # ------------------------------------------------------------------

    # This is the strongest single statement the stack can make without a WebRTC
    # client: a `bridge_count` of at least 1 means Prosody is up, Jicofo
    # authenticated to it over XMPP with the password the role wrote, the JVB
    # authenticated with its own, and the JVB then announced itself in the
    # brewery MUC where Jicofo found it. `active` units say none of that -
    # Jicofo and the JVB keep retrying their XMPP logins long after systemd
    # calls them active, hence the generous polling.
    - name: Wait for Jicofo to see a registered videobridge (up to 5m)
      ansible.builtin.uri:
        url: "{{ jitsi_verify_jicofo_url }}/stats"
        return_content: true
      register: jitsi_jicofo_stats
      failed_when: false
      until: >-
        jitsi_jicofo_stats.status == 200
        and (jitsi_jicofo_stats.json.bridge_selector.operational_bridge_count | default(0) | int) >= 1
      retries: 60
      delay: 5

    - name: Assert Jicofo sees an operational videobridge
      ansible.builtin.assert:
        that:
          - (jitsi_jicofo_stats.json.bridge_selector.bridge_count | default(0) | int) >= 1
          - (jitsi_jicofo_stats.json.bridge_selector.operational_bridge_count | default(0) | int) >= 1
        fail_msg: >-
          Jicofo does not see an operational videobridge
          (status={{ jitsi_jicofo_stats.status }},
          bridge_selector={{ jitsi_jicofo_stats.json.bridge_selector | default({}) }}).
          Either the JVB could not log into Prosody or Jicofo itself could not.
        success_msg: >-
          Jicofo reports {{ jitsi_jicofo_stats.json.bridge_selector.operational_bridge_count }}
          operational videobridge(s): Prosody is serving, and both Jicofo and the
          JVB authenticated to it

    # Jicofo's health check goes beyond bookkeeping: it creates a test
    # conference on a bridge and answers 200 only if that worked.
    - name: Ask Jicofo for its own health verdict (up to 60s)
      ansible.builtin.uri:
        url: "{{ jitsi_verify_jicofo_url }}/about/health"
        status_code: [200, 500, 503]
      register: jitsi_jicofo_health
      until: jitsi_jicofo_health.status == 200
      retries: 12
      delay: 5
      failed_when: false

    - name: Assert Jicofo considers itself healthy
      ansible.builtin.assert:
        that: jitsi_jicofo_health.status == 200
        fail_msg: "Jicofo's health check answered {{ jitsi_jicofo_health.status }}"
        success_msg: "Jicofo's health check answers 200, so it can create a conference on the bridge"

    # ------------------------------------------------------------------
    # The web frontend serves, and tells browsers what the role configured
    # ------------------------------------------------------------------

    - name: Wait for the Jitsi Web frontend to serve its page (up to 3m)
      ansible.builtin.uri:
        url: "{{ jitsi_verify_web_url }}/"
        return_content: true
      register: jitsi_web_page
      failed_when: false
      until: jitsi_web_page.status == 200
      retries: 36
      delay: 5

    - name: Assert the Jitsi Web frontend serves the conference application
      ansible.builtin.assert:
        that:
          - jitsi_web_page.status == 200
          - "'config.js' in jitsi_web_page.content"
          - "'app.bundle' in jitsi_web_page.content"
        fail_msg: >-
          The Jitsi Web frontend did not serve the conference application
          (status={{ jitsi_web_page.status }})
        success_msg: "The Jitsi Web frontend serves the conference application shell"

    # /config.js is rendered by the web container on startup from the
    # environment file the role wrote. It is where a browser learns which XMPP
    # domain to use and where to reach it, so it is the honest place to check
    # that the role's configuration reached the running process - in both
    # directions: the XMPP domain comes from the role's defaults, the BOSH URL
    # from this scenario's `jitsi_hostname`.
    - name: Retrieve the Jitsi Web frontend runtime configuration
      ansible.builtin.uri:
        url: "{{ jitsi_verify_web_url }}/config.js"
        return_content: true
        status_code: [200]
      register: jitsi_web_config_js

    - name: Assert the Jitsi Web frontend points browsers at the configured XMPP domain
      ansible.builtin.assert:
        that: >-
          ("config.hosts.domain = '" ~ jitsi_defaults.jitsi_xmpp_domain ~ "';")
          in jitsi_web_config_js.content
        fail_msg: >-
          config.js does not name {{ jitsi_defaults.jitsi_xmpp_domain }} as the XMPP domain:
          {{ jitsi_web_config_js.content | truncate(300) }}
        success_msg: >-
          config.js tells browsers to use the XMPP domain {{ jitsi_defaults.jitsi_xmpp_domain }}

    - name: Assert the Jitsi Web frontend derives its BOSH URL from the scenario's hostname
      ansible.builtin.assert:
        that: >-
          ("config.bosh = 'https://" ~ jitsi_hostname ~ "/' + subdir + 'http-bind';")
          in jitsi_web_config_js.content
        fail_msg: >-
          config.js does not derive its BOSH URL from https://{{ jitsi_hostname }}/:
          {{ jitsi_web_config_js.content | truncate(300) }}
        success_msg: >-
          config.js derives its BOSH URL from https://{{ jitsi_hostname }}/,
          which is this scenario's `jitsi_hostname`

    # ------------------------------------------------------------------
    # Prosody serves XMPP, and BOSH answers where config.js points
    # ------------------------------------------------------------------

    - name: Wait for Prosody to accept XMPP client connections (up to 60s)
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ jitsi_molecule_prosody_xmpp_port }}"
        timeout: 60

    - name: Ask Prosody's BOSH endpoint for its front page
      ansible.builtin.uri:
        url: "{{ jitsi_verify_prosody_http_url }}/http-bind"
        return_content: true
        status_code: [200]
      register: jitsi_prosody_bosh

    - name: Assert Prosody serves BOSH at /http-bind
      ansible.builtin.assert:
        that: "'BOSH' in jitsi_prosody_bosh.content"
        fail_msg: >-
          Prosody's /http-bind endpoint did not identify itself as BOSH:
          {{ jitsi_prosody_bosh.content | truncate(200) }}
        success_msg: "Prosody serves BOSH at /http-bind, where config.js points browsers"

    # ------------------------------------------------------------------
    # The JVB holds its media port open
    # ------------------------------------------------------------------

    # This is as far as the media plane can honestly be verified without a real
    # WebRTC client: actual SRTP/SCTP flow through the bridge is unprovable
    # here, and since upstream stable-11146 the JVB has no HTTP surface at all
    # (the Colibri WebSocket and its whole web server were removed), so there
    # is nothing to probe over HTTP. What can be proven is that the JVB process
    # itself bound its RTP/UDP port inside the container, and that the role
    # published it on the host.
    - name: Read the UDP sockets inside the JVB container
      ansible.builtin.command:
        cmd: >-
          docker exec {{ jitsi_molecule_jvb_container }}
          cat /proc/net/udp /proc/net/udp6
      register: jitsi_jvb_udp_sockets
      changed_when: false

    - name: Read the UDP listeners on the host
      ansible.builtin.command:
        cmd: ss -ulnH
      register: jitsi_host_udp_sockets
      changed_when: false

    # 2710 is 10000 (the role's default `jitsi_jvb_rtp_udp_port`) in the
    # hexadecimal notation /proc/net/udp uses.
    - name: Assert the JVB bound its RTP/UDP port and the role published it
      ansible.builtin.assert:
        that:
          - "':2710 ' in jitsi_jvb_udp_sockets.stdout"
          - "':10000 ' in jitsi_host_udp_sockets.stdout"
        fail_msg: >-
          UDP 10000 is not where it should be
          (bound inside the JVB container: {{ ':2710 ' in jitsi_jvb_udp_sockets.stdout }},
          published on the host: {{ ':10000 ' in jitsi_host_udp_sockets.stdout }})
        success_msg: >-
          The JVB bound UDP 10000 inside its container and the role published it
          on the host

    # ------------------------------------------------------------------
    # Every container runs the version `jitsi_version` pins
    # ------------------------------------------------------------------

    # The upstream images carry no runtime surface that names the release the
    # role pins: no OCI version label, no version in the environment, and the
    # software inside reports its own component versions (e.g. the web image
    # ships the `jitsi-meet-web` package as 1.0.xxxx), none of which is
    # derivable from the `stable-NNNNN` tag. The honest check that remains is
    # that every container the role started runs the exact image reference the
    # role's defaults pin - the leaf literal Renovate bumps.
    - name: Assert the Jitsi containers run the version the role pins
      ansible.builtin.assert:
        that:
          - jitsi_containers[jitsi_molecule_web_container].Config.Image | split(':') | last == jitsi_defaults.jitsi_version
          - jitsi_containers[jitsi_molecule_prosody_container].Config.Image | split(':') | last == jitsi_defaults.jitsi_version
          - jitsi_containers[jitsi_molecule_jicofo_container].Config.Image | split(':') | last == jitsi_defaults.jitsi_version
          - jitsi_containers[jitsi_molecule_jvb_container].Config.Image | split(':') | last == jitsi_defaults.jitsi_version
        fail_msg: >-
          The running containers do not match jitsi_version={{ jitsi_defaults.jitsi_version }}:
          {{ jitsi_containers.values() | map(attribute='Config.Image') | list }}
        success_msg: >-
          All four containers run what `jitsi_version` pins:
          {{ jitsi_containers.values() | map(attribute='Config.Image') | list }}

    # ------------------------------------------------------------------
    # Nothing was quietly restarting while all of that was being checked
    # ------------------------------------------------------------------

    # `Restart=always` means a unit reads `active` while it is crash-looping,
    # and a loop is exactly what a component with a wrong XMPP password would
    # settle into. The window starts here, with everything already answering,
    # and is comfortably longer than the units' `RestartSec=30`, so a crash
    # loop has to tick at least once inside it.
    - name: Sample the Jitsi restart counters
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: jitsi_restarts_before
      loop: "{{ jitsi_verify_units }}"

    - name: Watch the Jitsi services for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the Jitsi restart counters again
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: jitsi_restarts_after
      loop: "{{ jitsi_verify_units }}"

    - name: Assert no Jitsi service restarted while it was up
      ansible.builtin.assert:
        that: >-
          jitsi_restarts_after.results | map(attribute='status.NRestarts') | list
          == jitsi_restarts_before.results | map(attribute='status.NRestarts') | list
        fail_msg: >-
          A Jitsi service restarted while it was supposedly up, so `active` was
          hiding a crash loop. Before:
          {{ dict(jitsi_verify_units | zip(jitsi_restarts_before.results | map(attribute='status.NRestarts'))) }},
          after:
          {{ dict(jitsi_verify_units | zip(jitsi_restarts_after.results | map(attribute='status.NRestarts'))) }}
        success_msg: >-
          No Jitsi service restarted over 45 seconds of watching (restarts so far:
          {{ dict(jitsi_verify_units | zip(jitsi_restarts_after.results | map(attribute='status.NRestarts'))) }})

    - name: Show the Jitsi verification summary
      ansible.builtin.debug:
        msg:
          - "systemd: {{ dict(jitsi_verify_units | zip(jitsi_services.results | map(attribute='status.ActiveState'))) }}"
          - "unconfigured images: web rc={{ jitsi_web_control.rc }}, jicofo rc={{ jitsi_jicofo_control.rc }}"
          - "jicofo: stats {{ jitsi_jicofo_stats.status }} operational_bridge_count={{ jitsi_jicofo_stats.json.bridge_selector.operational_bridge_count | default('n/a') }}, health {{ jitsi_jicofo_health.status }}"
          - "web: {{ jitsi_web_page.status }}, config.js names {{ jitsi_defaults.jitsi_xmpp_domain }} and https://{{ jitsi_hostname }}/"
          - "prosody: XMPP port {{ jitsi_molecule_prosody_xmpp_port }} open, BOSH {{ jitsi_prosody_bosh.status }}"
          - "jvb: UDP 10000 bound in-container and published on the host"
          - "images: {{ jitsi_containers.values() | map(attribute='Config.Image') | list }}"
          - "restarts: {{ dict(jitsi_verify_units | zip(jitsi_restarts_after.results | map(attribute='status.NRestarts'))) }}"
