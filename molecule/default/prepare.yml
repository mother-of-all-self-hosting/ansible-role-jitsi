---
- name: Prepare Jitsi Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Jitsi Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Jitsi Molecule tests preparation
      ansible.builtin.package:
        name:
          # For the `uri` probes in verify.yml
          - python3-requests
          # For `ss`, which verify.yml uses to check the JVB's published UDP port.
          # The Debian test image does not ship iproute2.
          - iproute2
        state: present

    - name: Ensure Docker is installed for Jitsi Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs
